<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@1,900&amp;display=swap');
    </style>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5a1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e53e0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e0808;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)" />

  <!-- rantr text in Nunito Black Italic -->
  <text
    x="256"
    y="316"
    text-anchor="middle"
    font-family="'Nunito', 'Arial Black', sans-serif"
    font-size="152"
    font-weight="900"
    font-style="italic"
    fill="url(#textGrad)"
    letter-spacing="-2"
  >rantr</text>
</svg>
